minimumReleaseAgeExclude:
  - '@nuxt/*'
  - nuxt
  - clickable-path
  - nuxt-nightly
  - vue
  - '@vue/*'
  - fuzzysort@4.0.1

packages:
  - packages/*
  - packages/nuxt-cli/test/fixtures/*
  - playground

verifyDepsBeforeRun: install

overrides:
  '@nuxt/cli': workspace:*
  '@nuxt/schema': 4.5.2
  create-nuxt: workspace:*
  create-nuxt-app: workspace:*
  eslint-plugin-jsdoc: 64.0.2
  eslint-plugin-unicorn: 73.0.0
  h3: ^1.15.11
  httpxy: 0.5.5
  nitropack: 2.13.4
  nuxi: workspace:*
  # upstream issue with MISSING_EXPORT warnings
  rolldown: 1.2.3

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
