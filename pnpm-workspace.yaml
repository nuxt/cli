minimumReleaseAgeExclude:
  - '@nuxt/*'
  - nuxt
  - clickable-path
  - nuxt-nightly
  - vue
  - '@vue/*'
  - fuzzysort@4.0.1

packages:
  - packages/*
  - packages/nuxt-cli/test/fixtures/*
  - playground
  - playground-nightly

verifyDepsBeforeRun: install

overrides:
  '@nuxt/cli': workspace:*
  # scoped by range: `playground-nightly` resolves its own Nuxt 5 nightly schema
  '@nuxt/schema@^4': 4.5.2
  create-nuxt: workspace:*
  create-nuxt-app: workspace:*
  eslint-plugin-jsdoc: 64.3.1
  eslint-plugin-unicorn: 74.0.0
  # scoped by range: nitro v3 in `playground-nightly` needs h3 v2
  h3@^1: ^1.15.11
  httpxy: 0.5.5
  nitropack: 2.13.4
  nuxi: workspace:*
  # upstream issue with MISSING_EXPORT warnings
  rolldown: 1.2.5

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false

patchedDependencies:
  citty@0.2.2: patches/citty@0.2.2.patch
