<text x="419.5" y="20" text-anchor="middle" font-size="12" opacity=".6">nuxt curl</text>
<text y="62.7"><tspan x="16.0" textLength="67.2" lengthAdjust="spacingAndGlyphs" class="d">HTTP/1.1</tspan><tspan x="91.6" textLength="50.4" lengthAdjust="spacingAndGlyphs" class="c2">200 OK</tspan></text><text y="82.3"><tspan x="16.0" textLength="84.0" lengthAdjust="spacingAndGlyphs" class="c4">connection</tspan><tspan x="100.0" textLength="100.8" lengthAdjust="spacingAndGlyphs">: keep-alive</tspan></text><text y="101.9"><tspan x="16.0" textLength="117.6" lengthAdjust="spacingAndGlyphs" class="c4">content-length</tspan><tspan x="133.6" textLength="33.6" lengthAdjust="spacingAndGlyphs">: 58</tspan></text><text y="121.5"><tspan x="16.0" textLength="100.8" lengthAdjust="spacingAndGlyphs" class="c4">content-type</tspan><tspan x="116.8" textLength="151.2" lengthAdjust="spacingAndGlyphs">: application/json</tspan></text><text y="141.1"><tspan x="16.0" textLength="33.6" lengthAdjust="spacingAndGlyphs" class="c4">date</tspan><tspan x="49.6" textLength="260.4" lengthAdjust="spacingAndGlyphs">: Fri, 21 Aug 2026 13:06:02 GMT</tspan></text><text y="160.7"><tspan x="16.0" textLength="84.0" lengthAdjust="spacingAndGlyphs" class="c4">keep-alive</tspan><tspan x="100.0" textLength="92.4" lengthAdjust="spacingAndGlyphs">: timeout=5</tspan></text><text y="199.9"><tspan x="16.0" textLength="8.4" lengthAdjust="spacingAndGlyphs">{</tspan></text><text y="219.5"><tspan x="32.8" textLength="75.6" lengthAdjust="spacingAndGlyphs" class="c4">"message"</tspan><tspan x="108.4" textLength="16.8" lengthAdjust="spacingAndGlyphs">: </tspan><tspan x="125.2" textLength="344.4" lengthAdjust="spacingAndGlyphs" class="c2">"Hello from the Nuxt CLI capture fixture"</tspan></text><text y="239.1"><tspan x="16.0" textLength="8.4" lengthAdjust="spacingAndGlyphs">}</tspan></text>
</g>
