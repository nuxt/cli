name: translations

on:
  push:
    branches: ['main']
    paths:
      - 'docs/**'

permissions: {}

jobs:
  dispatch:
    if: github.repository == 'nuxt/cli'
    runs-on: ubuntu-latest
    environment: translations
    steps:
      # source-push is consumed by nuxt/translations' `translate` workflow
      - run: gh api repos/nuxt/translations/dispatches -f event_type=source-push -f "client_payload[sources]=nuxt-cli"
        env:
          GH_TOKEN: ${{ secrets.TRANSLATIONS_DISPATCH_TOKEN }}
